name: Paper I Palomar preflight

on:
  push:
    branches:
      - paper1/palomar-preflight-lean435
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: paper1pre001
      mode: full
      options: '{"comparator_config_path":"CollisionIdeals/Palomar/PaperOne/comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
