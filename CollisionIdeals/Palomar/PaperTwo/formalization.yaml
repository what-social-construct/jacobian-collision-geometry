# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Generic Degree Two in JC(2): Secant Projectors and Galois Rigidity"
  description: >-
    The formalization constructs the explicit ordered divided-difference
    collision projector for a planar Keller map, proves that it is the unique
    idempotent generating the collision obstruction, and identifies its
    complementary annihilator. It then proves that generic degree two forces this obstruction
    to be nonzero and, conditional on classical Keller--Galois rigidity,
    excludes the Keller condition.
  authors:
    - "Chloe van der Vlugt"
  license: "MIT"
  responsible_maintainers:
    - "Chloe van der Vlugt"

classification:
  arxiv: ["math.AG"]
  msc2020: ["14R15"]

sources:
  - title: "Generic Degree Two in JC(2): Secant Projectors and Galois Rigidity"
    authors:
      - "Chloe van der Vlugt"
    type: "paper"
    location: "https://github.com/what-social-construct/jacobian-collision-geometry/blob/92701395df3ff424666e7319f286e831a851a6f8/paper/paper2.pdf"
    relationship: "formalizes"
    note: "Versioned companion manuscript for the explicit projector and collision-theoretic degree-two exclusion."
  - title: "Generic Degree Three in JC(3): Collision Geometry and Galois Group S3"
    authors:
      - "Chloe van der Vlugt"
    type: "paper"
    location: "https://github.com/what-social-construct/jacobian-collision-geometry/blob/92701395df3ff424666e7319f286e831a851a6f8/paper/paper1.pdf"
    relationship: "background"
    note: "Supplies the dimension-independent collision construction and the stated classical rigidity input used by Paper II."
  - title: "Polynomial maps with constant Jacobian"
    authors:
      - "Michael J. Razar"
    type: "paper"
    location: "https://doi.org/10.1007/BF02764906"
    relationship: "background"
    note: "A source for the classical Keller--Galois rigidity theorem, passed explicitly to the Lean result."
  - title: "There are no Keller maps having prime degree field extensions"
    authors:
      - "Vered Moskowicz"
    type: "paper"
    location: "https://arxiv.org/abs/2407.13795"
    relationship: "independently-proves"
    note: "Proves a broader prime-degree exclusion; the submitted result gives an independent collision-projector proof of its quadratic case."
  - title: "Bézoutians and injectivity of polynomial maps"
    authors:
      - "Stephen McKean"
    type: "paper"
    location: "https://doi.org/10.1016/j.jpaa.2022.107298"
    relationship: "background"
    note: "Background for the multivariate divided-difference Bézoutian underlying the explicit secant determinant."

status:
  scope: >-
    The quadratic collision nonvanishing is proved internally. The final
    exclusion is conditional on the explicit parameter
    ComplexKellerGaloisRigidity 2; that literature theorem is neither assumed
    as a project axiom nor proved here. The submission treats only generic
    degree two and does not prove the full two-dimensional Jacobian
    conjecture; nonnormal generic degrees at least three remain outside its
    scope. Optional boundary-research modules and their external assumptions
    are not imported by the submitted Solution.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "CollisionIdeals.Palomar.PaperTwo.explicitPlanarSecantProjector"
      file: "CollisionIdeals/Palomar/PaperTwo/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "CollisionIdeals/Palomar/PaperTwo/comparator.json"
    - declaration: "CollisionIdeals.Palomar.PaperTwo.quadraticPlanarCollisionRigidity"
      file: "CollisionIdeals/Palomar/PaperTwo/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "CollisionIdeals/Palomar/PaperTwo/comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI GPT-5.6 Sol"]
      framework: "OpenAI Codex"
      tool_setup: "Iterative AI-assisted Lean formalization with local compilation, kernel checks, and author-directed manuscript comparison."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and hosted model API"
      prompting_notes: "The author directed the collision contradiction, module split, semantic-parity checks, and manuscript pruning; agents implemented and tested bounded subtasks."
  spend_usd: "subscription-based"
  notes: "The author reviewed the mathematical statements, formal interfaces, and manuscript alignment."

fidelity:
  divergences: >-
    The explicit projector declaration includes its idempotence, obstruction
    generator, and complementary annihilator statements, but omits the
    manuscript's standard product decomposition by complementary idempotents.
    Keller--Galois rigidity is exposed as a hypothesis rather than formalized.

review:
  status: "self-assessed"
  reviewers:
    - "Chloe van der Vlugt (author self-review)"
  notes: "The statement was checked against the focused Paper II proof and the Solution was compiled with warnings treated as errors."

alignment:
  namespace: "CollisionIdeals.Palomar.PaperTwo"
  statements:
    - source: "Paper II, Theorem 3.2 (Planar secant projector)"
      lean: "CollisionIdeals.Palomar.PaperTwo.explicitPlanarSecantProjector"
      module: "CollisionIdeals.Palomar.PaperTwo.Solution"
      status: "proved"
      note: "The compared statement displays the ordered divided-difference formula and proves its idempotent, unique obstruction-generator, and annihilator properties."
    - source: "Paper II, Theorem 5.3 (Exclusion of generic degree two)"
      lean: "CollisionIdeals.Palomar.PaperTwo.quadraticPlanarCollisionRigidity"
      module: "CollisionIdeals.Palomar.PaperTwo.Solution"
      status: "proved"
      note: "The wrapper combines unconditional quadratic collision nonvanishing with the conditional Keller exclusion."

acknowledgements: "Lean 4, Mathlib, and OpenAI Codex supported the formalization and manuscript workflow."
