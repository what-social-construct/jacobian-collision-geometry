# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Generic Degree Three in JC(3): Collision Geometry and Galois Group S3"
  description: >-
    Motivated by Alpöge's generic-degree-three counterexample to JC(3), we
    formalize the collision geometry of complex three-dimensional Keller
    maps of that degree. Using classical Keller–Galois rigidity, we identify
    the residual generic collision factor with the normal closure of the
    induced function-field extension, whose Galois group is S3. The
    decomposition separates the diagonal and proves nonvanishing of the
    collision obstruction.
  authors:
    - "Chloe van der Vlugt"
  license: "MIT"
  responsible_maintainers:
    - "Chloe van der Vlugt"

classification:
  arxiv: ["math.AG", "math.GR"]
  msc2020: ["14R15", "12F10"]

sources:
  - title: "Generic Degree Three in JC(3): Collision Geometry and Galois Group S3"
    authors:
      - "Chloe van der Vlugt"
    type: "paper"
    location: "https://github.com/what-social-construct/jacobian-collision-geometry/blob/15bfc1e6a19ece495e159f931d53defc0ca2edcc/paper/paper1.pdf"
    relationship: "formalizes"
    note: "Versioned manuscript stating and proving the submitted collision theorem."
  - title: "Post announcing an explicit counterexample to the Jacobian conjecture"
    authors:
      - "Levent Alpöge"
    type: "web post"
    location: "https://x.com/__alpoge__/status/2079028340955197566"
    relationship: "background"
    note: "The motivating three-dimensional counterexample, cited as Alpoge2026 in the manuscript bibliography. Its generic degree is documented in Gao's Theorem 3.3; the explicit example itself is not constructed or verified by the submitted Lean theorem."
  - title: "Counterexamples to the Jacobian conjecture in dimensions greater than two"
    authors:
      - "Shuhong Gao"
    type: "paper"
    location: "https://arxiv.org/abs/2608.00222"
    relationship: "background"
    note: "arXiv:2608.00222v1, Theorem 3.3. Documents the nonzero constant Jacobian and generic degree three of Alpöge's example; cited as Gao2026Counterexamples in the manuscript bibliography."
  - title: "Polynomial maps with constant Jacobian"
    authors:
      - "Michael J. Razar"
    type: "paper"
    location: "https://doi.org/10.1007/BF02764906"
    relationship: "background"
    note: "One source for the classical Keller--Galois rigidity input, which remains an explicit hypothesis in the submitted theorem."
  - title: "The Stacks Project in Lean"
    authors:
      - "Axiom Math contributors"
    type: "formalization"
    location: "https://github.com/AxiomMath/Stacks/blob/f8e70c5dd04bfabcb423d5e325461f527c85a5d6/StacksCore/FieldTheory/Normal/Closure.lean"
    relationship: "adapts"
    note: "The reviewed StacksCore proof of normal-closure finiteness (tag 09DT) is selectively adapted to the project's Mathlib version, with source attribution and Apache-2.0 terms retained."

status:
  scope: >-
    The submitted declaration is conditional on a plainly stated
    Keller--Galois rigidity hypothesis and on supplied normal-closure
    data. Finiteness of that closure follows internally from cubic degree.
    It reconstructs separability, a cubic power basis, generic-source
    surjectivity, and nonnormality internally, proves a diagonal-compatible
    collision product with the normal closure, obtains Galois group S3, and
    proves nonvanishing of the affine obstruction. It makes no existence claim
    for a generic-degree-three counterexample and does not formalize the
    classical rigidity theorem itself.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "CollisionIdeals.Palomar.PaperOne.genericDegreeThreeS3Collision"
      file: "CollisionIdeals/Palomar/PaperOne/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "CollisionIdeals/Palomar/PaperOne/comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI GPT-5.6 Sol"]
      framework: "OpenAI Codex"
      tool_setup: "Iterative AI-assisted Lean formalization with local compilation, kernel checks, and author-directed manuscript comparison."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and hosted model API"
      prompting_notes: "The author directed theorem design, object ownership, semantic-parity audits, and proof review; agents implemented and tested bounded subtasks."
  spend_usd: "subscription-based"
  notes: "The author reviewed the mathematical statements, formal interfaces, and manuscript alignment."

fidelity:
  divergences: >-
    The classical Keller--Galois rigidity theorem is an explicit theorem
    parameter rather than an installed axiom or a Lean proof. The submission
    omits the redundant affine off-diagonal-scheme nonemptiness conclusion of
    the larger project theorem.

review:
  status: "self-assessed"
  reviewers:
    - "Chloe van der Vlugt (author self-review)"
  notes: >-
    The independent Challenge and proved Solution expose the same statement.
    The intentional Challenge sorry is the proof-comparison target; the zero
    counts above refer to the Solution. Both entries passed the protected
    preflight on 2026-11-04 at release commit
    ccbba1356d6e737e1e7dd336a7014360e2f52251, in workflow run
    https://github.com/what-social-construct/jacobian-collision-geometry/actions/runs/41967486280.
    That pass covers the strengthened declaration without a redundant
    finiteNormal parameter. Verification evidence is commit-specific; the
    final package is identified by its frozen release commit and matching
    workflow report.

alignment:
  namespace: "CollisionIdeals.Palomar.PaperOne"
  statements:
    - source: "Paper I, Theorem 3.3 (Generic cubic S3 collision)"
      lean: "CollisionIdeals.Palomar.PaperOne.genericDegreeThreeS3Collision"
      module: "CollisionIdeals.Palomar.PaperOne.Solution"
      status: "proved"
      note: >-
        The wrapper proves the Keller specialization of Theorem 3.3. It
        receives the rigidity hypothesis and a supplied normal closure,
        derives that closure's finiteness, separability of the cubic
        extension, a power basis, generic-source surjectivity, and
        nonnormality. The canonical project endpoint also constructs the
        normal closure internally.

acknowledgements: "Lean 4, Mathlib, and OpenAI Codex supported the formalization and manuscript workflow."
